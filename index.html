<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartClock">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>Smart Desk Clock</title>
  <style>
    :root {
      --u: 3.75px; /* 1% del alto de pantalla, lo recalcula el script */
      --bg: #07090f;
      --card: #11151f;
      --card2: #0b0e15;
      --border: #1d2435;
      --accent: #00e5ff;
      --accent-2: #7c4dff;
      --glow: rgba(0, 229, 255, .35);
      --text: #eef3ff;
      --muted: #8393ab;
      --off: #1a2133;
      --good: #00e676;
      --warn: #ffab00;
    }

    /* Modo noche: tonos cálidos y muy apagados */
    body.night {
      --bg: #050302;
      --card: #0d0805;
      --card2: #090604;
      --border: #1b120a;
      --accent: #d9822b;
      --accent-2: #8f3d1c;
      --glow: rgba(217, 130, 43, .14);
      --text: #c99a6b;
      --muted: #6c5540;
      --off: #150d07;
      --good: #8a6a2f;
      --warn: #a8641c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html { background: #000; height: 100%; }

    body {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      transition: background-color 1.2s ease, color 1.2s ease;
    }

    .num { font-family: "DIN Alternate", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif; }

    #app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; cursor: pointer; }

    .board, .bigclock { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

    /* ---------- TABLERO ---------- */
    .board {
      opacity: 1;
      transform: none;
      transition: opacity .45s ease .1s, transform .45s ease .1s, visibility 0s;
    }
    body.big .board {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      transition: opacity .4s ease, transform .4s ease, visibility 0s linear .4s;
    }
    body.big .board,
    body.big .board * { animation-play-state: paused !important; }

    .dashboard {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      grid-template-rows: 1fr .78fr;
      gap: 10px;
      width: 100%;
      height: 100%;
      padding: 10px;
    }

    .card {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background-color 1.2s ease, border-color 1.2s ease;
    }

    /* Reloj */
    .clock-card {
      justify-content: center;
      background-image: radial-gradient(circle at top left, rgba(255,255,255,.06), rgba(255,255,255,0) 70%);
    }
    .clock-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle, var(--border) 1.2px, transparent 1.7px);
      background-size: 11px 11px;
      opacity: .75;
      -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 62%);
      mask-image: linear-gradient(135deg, #000 0%, transparent 62%);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      top: 10px; left: 16px; right: 16px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .status-left { display: flex; align-items: center; }
    #ver { margin-left: 8px; opacity: .6; }

    .dot-live {
      display: inline-block;
      width: 8px; height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 8px var(--good);
      animation: pulse 2s infinite;
    }
    .dot-live.off { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

    .btns { display: flex; gap: 6px; }
    .btn {
      height: 30px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .time-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      margin-top: 8px;
    }
    .time-main {
      display: flex;
      align-items: baseline;
      font-size: calc(var(--u) * 24);
      font-weight: 700;
      line-height: 1;
      color: var(--text);
      text-shadow: 0 0 22px var(--glow);
      transition: color 1.2s ease;
    }
    .d { display: inline-block; width: .6em; text-align: center; }
    .d.flip { animation: flip .45s ease; }
    .colon { display: inline-block; width: .34em; text-align: center; animation: blink 1s steps(1, end) infinite; }
    .time-sec {
      margin-left: 8px;
      min-width: 1.3em;
      font-size: calc(var(--u) * 8.5);
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .date-text {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      font-size: calc(var(--u) * 4.6);
      font-weight: 500;
      color: var(--muted);
    }

    .ticks {
      position: absolute;
      left: 16px; right: 16px; bottom: 12px;
      z-index: 1;
      display: flex;
      gap: 2px;
      height: 5px;
    }
    .tick { flex: 1; border-radius: 2px; background: var(--off); transition: background-color .3s ease; }
    .tick.on { background: var(--accent); opacity: .55; }
    .tick.now { background: var(--text); }

    /* Clima */
    .weather-card {
      background-image: radial-gradient(circle at top right, rgba(255,255,255,.06), rgba(255,255,255,0) 75%);
    }
    .weather-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .weather-temp {
      font-size: calc(var(--u) * 13);
      font-weight: 700;
      line-height: 1;
      transition: color 1.2s ease;
    }
    body.night .weather-temp { color: var(--text) !important; }
    .weather-desc { margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--accent); }
    .weather-sub { margin-top: 3px; font-size: 12px; color: var(--muted); }

    .icon-wrap {
      position: relative;
      width: calc(var(--u) * 13);
      height: calc(var(--u) * 13);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap::before {
      content: "";
      position: absolute;
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,196,64,.38), rgba(255,196,64,0) 70%);
      opacity: 0;
    }
    .sunny .icon-wrap::before { opacity: 1; animation: halo 3.6s ease-in-out infinite; }
    body.night .icon-wrap::before { display: none; }
    .weather-icon { position: relative; font-size: calc(var(--u) * 10.5); animation: float 5s ease-in-out infinite; }
    body.night .weather-icon, body.night .f-ico, body.night #bw-ico { filter: saturate(.45) brightness(.65); }

    .weather-details {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .weather-details strong { display: block; margin-top: 1px; font-size: 15px; color: var(--text); }

    .fx { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; }
    .drop {
      display: none;
      position: absolute;
      top: -24px;
      width: 2px; height: 14px;
      border-radius: 2px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), var(--accent));
    }
    .rainy .drop, .stormy .drop { display: block; opacity: .55; animation: fall 1.1s linear infinite; }
    .star {
      display: none;
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .2;
    }
    body.night .star { display: block; animation: twinkle 3.2s ease-in-out infinite; }
    .stormy::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      animation: flash 7s infinite;
    }
    body.night .stormy::after { display: none; }

    /* Matriz y mensajes */
    .matrix-card { flex-direction: row; align-items: center; justify-content: flex-start; }
    #mx { flex-shrink: 0; display: block; }
    .ticker-box { flex: 1; min-width: 0; margin-left: 16px; display: flex; flex-direction: column; justify-content: center; }
    .ticker-tag { font-size: 13px; font-weight: 700; color: var(--accent); }
    .ticker-msg { margin-top: 5px; font-size: calc(var(--u) * 4.2); font-weight: 600; line-height: 1.3; }
    .ticker-box.swap .ticker-tag, .ticker-box.swap .ticker-msg { animation: tickIn .55s ease both; }

    /* Próximas horas */
    .forecast-title { font-size: 13px; font-weight: 600; color: var(--muted); }
    .forecast-list { display: flex; gap: 6px; margin-top: 6px; }
    .f-item {
      flex: 1;
      min-width: 0;
      padding: 7px 2px;
      text-align: center;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .f-item.rise { animation: rise .5s ease both; }
    .f-hour { font-size: 12px; color: var(--muted); }
    .f-ico { margin: 3px 0; font-size: 20px; }
    .f-val { font-size: 15px; font-weight: 700; }
    .f-rain { height: 13px; margin-top: 2px; font-size: 11px; color: var(--accent); }

    /* ---------- RELOJ GRANDE ---------- */
    .bigclock {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      opacity: 0;
      visibility: hidden;
      transform: scale(.96);
      transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
    }
    body.big .bigclock {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .45s ease .1s, transform .45s ease .1s, visibility 0s;
    }
    #big { display: block; }
    .big-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: calc(var(--u) * 3);
      font-size: calc(var(--u) * 6.4);
      font-weight: 600;
    }
    .big-w { display: flex; align-items: center; }
    .big-w span { margin-left: calc(var(--u) * 2.4); }
    #bw-rain { font-size: .7em; color: var(--accent); }
    .hint {
      position: absolute;
      bottom: calc(var(--u) * 3);
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      opacity: 0;
    }
    .hint.show { animation: hint 3.6s ease forwards; }

    /* Capas generales */
    #shade {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 5;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }
    body.night #shade { opacity: .3; }

    #rotate {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9;
      padding: 30px;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      background: var(--bg);
      color: var(--text);
    }
    @media (orientation: portrait) { #rotate { display: flex; } }

    /* Animaciones */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .2; } 100% { opacity: 1; } }
    @keyframes flip { 0% { transform: translateY(-12%); opacity: .2; } 100% { transform: none; opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes halo { 0%, 100% { transform: scale(.92); opacity: .55; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes fall { from { transform: translateY(0); } to { transform: translateY(250px); } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .8; } }
    @keyframes flash { 0%, 94%, 100% { opacity: 0; } 95% { opacity: .14; } 96% { opacity: 0; } 97% { opacity: .1; } 98% { opacity: 0; } }
    @keyframes tickIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes hint { 0% { opacity: 0; } 12% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .board *, .bigclock * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- TABLERO COMPLETO -->
    <div class="board" id="board">
      <div class="dashboard">

        <div class="card clock-card">
          <div class="status-bar">
            <div class="status-left">
              <span class="dot-live" id="dot"></span>
              <span id="city-label">Colima</span>
              <span id="ver"></span>
            </div>
            <div class="btns">
              <div class="btn" id="btn-theme" role="button">🎨 Tema</div>
              <div class="btn" id="btn-night" role="button">🌙 Auto</div>
            </div>
          </div>
          <div class="time-row num">
            <div class="time-main">
              <span class="d" id="d0">0</span><span class="d" id="d1">0</span><span class="colon">:</span><span class="d" id="d2">0</span><span class="d" id="d3">0</span>
            </div>
            <div class="time-sec" id="seconds">00</div>
          </div>
          <div class="date-text" id="date">Cargando fecha…</div>
          <div class="ticks" id="ticks"></div>
        </div>

        <div class="card weather-card" id="wcard">
          <div class="fx" id="fx"></div>
          <div class="weather-top">
            <div>
              <div class="weather-temp num" id="temp">--°</div>
              <div class="weather-desc" id="w-desc">Actualizando clima…</div>
              <div class="weather-sub" id="w-sub">&nbsp;</div>
            </div>
            <div class="icon-wrap"><div class="weather-icon" id="w-icon">⛅</div></div>
          </div>
          <div class="weather-details">
            <span>Mín / Máx<strong id="w-minmax">--° / --°</strong></span>
            <span>Humedad<strong id="w-hum">--%</strong></span>
            <span>Viento<strong id="w-wind">-- km/h</strong></span>
          </div>
        </div>

        <div class="card matrix-card">
          <canvas id="mx"></canvas>
          <div class="ticker-box" id="ticker-box">
            <div class="ticker-tag" id="ticker-tag">Estado</div>
            <div class="ticker-msg" id="ticker-text">Conectando con el clima…</div>
          </div>
        </div>

        <div class="card forecast-card">
          <div class="forecast-title">Próximas horas</div>
          <div class="forecast-list" id="forecast">
            <div class="f-item"><div class="f-hour">--:--</div><div class="f-ico">⏳</div><div class="f-val">--°</div><div class="f-rain"></div></div>
            <div class="f-item"><div class="f-hour">--:--</div><div class="f-ico">⏳</div><div class="f-val">--°</div><div class="f-rain"></div></div>
            <div class="f-item"><div class="f-hour">--:--</div><div class="f-ico">⏳</div><div class="f-val">--°</div><div class="f-rain"></div></div>
            <div class="f-item"><div class="f-hour">--:--</div><div class="f-ico">⏳</div><div class="f-val">--°</div><div class="f-rain"></div></div>
          </div>
        </div>

      </div>
    </div>

    <!-- RELOJ GRANDE (matriz de puntos) -->
    <div class="bigclock" id="bigclock">
      <canvas id="big"></canvas>
      <div class="big-info num" id="big-info">
        <div id="big-date">&nbsp;</div>
        <div class="big-w">
          <span id="bw-ico"></span><span id="bw-temp"></span><span id="bw-rain"></span>
        </div>
      </div>
      <div class="hint" id="hint">Toca para volver al panel</div>
    </div>

    <div id="shade"></div>
    <div id="rotate">Gira el iPhone en horizontal para ver el reloj</div>
  </div>

  <script>
  (function () {
    'use strict';

    var VERSION = 'v2.0';

      '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +

      set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

    function hexToRgb(h) {

    function rgba(h, a) { var c = hexToRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

    /* ---------- Toques confiables en iOS 15 ---------- */
    // touchend + click con anti-duplicado, ignora arrastres.

        if (e.cancelable) e.preventDefault(); // evita el click fantasma
        fire(e);
      }, { passive: false });
      el.addEventListener('click', function (e) { e.stopPr

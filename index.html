<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SmartClock" />
  <title>Smart Desk Clock</title>
  <style>
    :root {
      --bg: #090b10;
      --card: #121622;
      --border: #1e2538;
      --accent: #00e5ff;
      --accent-2: #7c4dff;
      --text: #f0f4ff;
      --muted: #7f8ea3;
      --good: #00e676;
      --warn: #ffab00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      grid-template-rows: 1fr 0.72fr;
      gap: 12px;
      width: 100vw;
      height: 100vh;
      padding: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Tarjeta 1: Reloj Principal */
    .clock-card {
      justify-content: center;
      background: radial-gradient(circle at top left, #171f33 0%, var(--card) 70%);
    }

    .status-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .dot-live {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--good);
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px var(--good);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .time-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 10px;
    }

    .time-main {
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 30%, #a8c0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .time-sec {
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .date-text {
      margin-top: 8px;
      font-size: 17px;
      font-weight: 500;
      color: var(--muted);
      text-transform: capitalize;
    }

    /* Tarjeta 2: Clima */
    .weather-card {
      background: radial-gradient(circle at top right, #152536 0%, var(--card) 75%);
    }

    .weather-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .weather-temp {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
    }

    .weather-icon {
      font-size: 44px;
    }

    .weather-desc {
      font-size: 15px;
      color: var(--accent);
      font-weight: 600;
      margin-top: 4px;
    }

    .weather-details {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .weather-details span strong {
      color: var(--text);
      display: block;
      font-size: 15px;
    }

    /* Tarjeta 3: Matriz animada estilo ESP32 */
    .matrix-card {
      flex-direction: row;
      align-items: center;
      gap: 16px;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
      width: 150px;
      height: 88px;
      flex-shrink: 0;
    }

    .pixel {
      background: #1a2133;
      border-radius: 3px;
      transition: background 0.25s, box-shadow 0.25s;
    }

    .pixel.on {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .pixel.alt {
      background: var(--accent-2);
      box-shadow: 0 0 6px var(--accent-2);
    }

    .ticker-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .ticker-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent);
      font-weight: 700;
    }

    .ticker-msg {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    /* Tarjeta 4: Estado del sistema / Pronóstico */
    .forecast-card {
      justify-content: space-between;
    }

    .forecast-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
    }

    .forecast-list {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
    }

    .f-item {
      flex: 1;
      background: #0d1019;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
    }

    .f-hour {
      font-size: 11px;
      color: var(--muted);
    }

    .f-ico {
      font-size: 18px;
      margin: 4px 0;
    }

    .f-val {
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="dashboard" onclick="toggleTheme()">
    <!-- RELOJ -->
    <div class="card clock-card">
      <div class="status-bar">
        <span><span class="dot-live"></span>ESP-STYLE DESK HUB</span>
        <span id="city-label">COLIMA, MX</span>
      </div>
      <div class="time-row">
        <div class="time-main" id="clock">00:00</div>
        <div class="time-sec" id="seconds">00</div>
      </div>
      <div class="date-text" id="date">Cargando fecha...</div>
    </div>

    <!-- CLIMA ACTUAL -->
    <div class="card weather-card">
      <div>
        <div class="weather-top">
          <div class="weather-temp" id="temp">--°</div>
          <div class="weather-icon" id="w-icon">⛅</div>
        </div>
        <div class="weather-desc" id="w-desc">Actualizando clima...</div>
      </div>
      <div class="weather-details">
        <span>Mín / Máx<strong id="w-minmax">--° / --°</strong></span>
        <span>Humedad<strong id="w-hum">--%</strong></span>
        <span>Viento<strong id="w-wind">-- km/h</strong></span>
      </div>
    </div>

    <!-- MATRIZ LED VIRTUAL + NOTAS -->
    <div class="card matrix-card">
      <div class="matrix-grid" id="matrix"></div>
      <div class="ticker-box">
        <div class="ticker-label" id="ticker-tag">MODO ACTIVO</div>
        <div class="ticker-msg" id="ticker-text">Toca la pantalla para cambiar el color del tema</div>
      </div>
    </div>

    <!-- PRONÓSTICO PRÓXIMAS HORAS -->
    <div class="card forecast-card">
      <div class="forecast-title">Próximas horas</div>
      <div class="forecast-list" id="forecast">
        <div class="f-item"><div class="f-hour">--:--</div><div class="f-ico">⏳</div><div class="f-val">--°</div></div>
        <div class="f-item"><div class="f-hour">--:--</div><div class="f-ico">⏳</div><div class="f-val">--°</div></div>
        <div class="f-item"><div class="f-hour">--:--</div><div class="f-ico">⏳</div><div class="f-val">--°</div></div>
      </div>
    </div>
  </div>

  <script>
    // Coordenadas por defecto (Colima, México). Puedes cambiarlas si quieres.
    const LAT = 19.2433;
    const LON = -103.7250;

    // 1. RELOJ Y FECHA
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clock').textContent = `${h}:${m}`;
      document.getElementById('seconds').textContent = s;

      const opciones = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('es-MX', opciones);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. MATRIZ DE PUNTOS ANIMADA (ESTILO MAX7219 / ESP32)
    const matrixEl = document.getElementById('matrix');
    const totalPixels = 12 * 7;
    const pixels = [];
    for (let i = 0; i < totalPixels; i++) {
      const div = document.createElement('div');
      div.className = 'pixel';
      matrixEl.appendChild(div);
      pixels.push(div);
    }

    function animateMatrix() {
      for (let col = 0; col < 12; col++) {
        const level = Math.floor(Math.random() * 7) + 1;
        for (let row = 0; row < 7; row++) {
          const idx = row * 12 + col;
          const active = (6 - row) < level;
          pixels[idx].className = 'pixel' + (active ? (row < 2 ? ' alt' : ' on') : '');
        }
      }
    }
    setInterval(animateMatrix, 320);
    animateMatrix();

    // 3. MENSAJES ROTATIVOS
    const mensajes = [
      { tag: 'ESTADO', msg: 'Sistema en línea · Sincronizado por Wi-Fi' },
      { tag: 'TIP VISUAL', msg: 'Toca la pantalla para alternar colores LED' },
      { tag: 'ENERGÍA', msg: 'Activa Acceso Guiado (3 clics Home) para fijar pantalla' }
    ];
    let msgIdx = 0;
    setInterval(() => {
      msgIdx = (msgIdx + 1) % mensajes.length;
      document.getElementById('ticker-tag').textContent = mensajes[msgIdx].tag;
      document.getElementById('ticker-text').textContent = mensajes[msgIdx].msg;
    }, 8000);

    // 4. CLIMA REAL CON OPEN-METEO (SIN API KEY)
    function weatherCodeToInfo(code) {
      if (code === 0) return ['☀️', 'Despejado'];
      if ([1, 2].includes(code)) return ['⛅', 'Parcialmente nublado'];
      if (code === 3) return ['☁️', 'Nublado'];
      if ([45, 48].includes(code)) return ['🌫️', 'Neblina'];
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return ['🌧️', 'Lluvia'];
      if ([95, 96, 99].includes(code)) return ['⛈️', 'Tormenta eléctrica'];
      return ['🌤️', 'Variable'];
    }

    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();

        const temp = Math.round(data.current.temperature_2m);
        const hum = data.current.relative_humidity_2m;
        const wind = Math.round(data.current.wind_speed_10m);
        const [ico, desc] = weatherCodeToInfo(data.current.weather_code);
        const tMin = Math.round(data.daily.temperature_2m_min[0]);
        const tMax = Math.round(data.daily.temperature_2m_max[0]);

        document.getElementById('temp').textContent = `${temp}°`;
        document.getElementById('w-icon').textContent = ico;
        document.getElementById('w-desc').textContent = desc;
        document.getElementById('w-minmax').textContent = `${tMin}° / ${tMax}°`;
        document.getElementById('w-hum').textContent = `${hum}%`;
        document.getElementById('w-wind').textContent = `${wind} km/h`;

        // Próximas 3 franjas (+3h, +6h, +9h)
        const nowHour = new Date().getHours();
        const forecastEl = document.getElementById('forecast');
        forecastEl.innerHTML = '';

        [3, 6, 9].forEach(offset => {
          const targetIdx = nowHour + offset;
          if (data.hourly.time[targetIdx]) {
            const hourStr = data.hourly.time[targetIdx].slice(11, 16);
            const fTemp = Math.round(data.hourly.temperature_2m[targetIdx]);
            const [fIco] = weatherCodeToInfo(data.hourly.weather_code[targetIdx]);
            forecastEl.innerHTML += `
              <div class="f-item">
                <div class="f-hour">${hourStr}</div>
                <div class="f-ico">${fIco}</div>
                <div class="f-val">${fTemp}°</div>
              </div>
            `;
          }
        });
      } catch (e) {
        document.getElementById('w-desc').textContent = 'Sin conexión al clima';
      }
    }

    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000); // Actualiza cada 15 min

    // 5. CAMBIO DE COLOR AL TOCAR LA PANTALLA
    const themes = [
      ['#00e5ff', '#7c4dff'], // Cyan / Morado
      ['#00e676', '#00b0ff'], // Verde Matrix / Azul
      ['#ff9100', '#ff1744'], // Ámbar retro / Rojo
      ['#f50057', '#651fff']  // Neón magenta
    ];
    let tIdx = 0;
    function toggleTheme() {
      tIdx = (tIdx + 1) % themes.length;
      document.documentElement.style.setProperty('--accent', themes[tIdx][0]);
      document.documentElement.style.setProperty('--accent-2', themes[tIdx][1]);
    }
  </script>
</body>
</html>
